# reusable worker template
x-worker: &worker 
  # &worker is an anchor that books mark the following block
  build: .
  command: python -m mapreduce.worker
  cpus: "1"
  environment:
    BOSS_URL: http://boss:5000
  volumes:
    - ./shared:/shared
  depends_on:
    - boss

services:
  boss:
    build: .
    command: python -m mapreduce.boss
    ports:
      # change if needed
      - "127.0.0.1:5050:5000"
    volumes:
      - ./shared:/shared
  # all the worker will use the same config; the hostname is the worker id
  # (stable across restarts, readable in logs)
  worker1: {<<: *worker, hostname: worker1}
  worker2: {<<: *worker, hostname: worker2}
  worker3: {<<: *worker, hostname: worker3}
  worker4: {<<: *worker, hostname: worker4}
