x-worker: &worker
  build: .
  command: python -m mapreduce.worker
  cpus: "1"
  environment:
    BOSS_URL: http://boss:5000
  volumes:
    - ./shared:/shared
  depends_on:
    - boss

services:
  boss:
    build: .
    command: python -m mapreduce.boss
    ports:
      - "5000:5000"
    volumes:
      - ./shared:/shared
  worker1: *worker
  worker2: *worker
  worker3: *worker
  worker4: *worker
