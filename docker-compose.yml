# reusable worker template
x-worker: &worker 
  # &worker is an anchor that books mark the following block
  build: .
  command: python -m mapreduce.worker
  cpus: "1"
  environment:
    BOSS_URL: http://boss:5000
  volumes:
    - ./shared:/shared
  depends_on:
    - boss

services:
  boss:
    build: .
    command: python -m mapreduce.boss
    ports:
      # change if needed
      - "127.0.0.1:5001:5000"
    volumes:
      - ./shared:/shared
  # all the worker will use the same config
  worker1: *worker
  worker2: *worker
  worker3: *worker
  worker4: *worker
